apiVersion: apps/v1
kind: Deployment
metadata:
 name: cicd-spring-k8s-deployment
spec:
 replicas: 2
 selector:
  matchLabels:
   app: cicd-spring-k8s-deployment
 template:
  metadata:
   labels:
    app: cicd-spring-k8s-deployment
  spec:
   containers:
    - name : devops-integration
      image : callmee6/devops-integration:latest
      imagePullPolicy: Always
      ports:
       - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
 name: cicd-spring-k8s-service
spec:
 selector:
  app: cicd-spring-k8s-deployment
 ports:
  - protocol: "TCP"
    port: 8080
    targetPort: 8080
 type: NodePort
